name: Helm CD

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      release_name:
        description: 'Helm release name'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: true
        type: string
      chart:
        description: 'Chart reference'
        required: true
        type: string
      chart_version:
        description: 'Chart version to deploy'
        required: false
        type: string
        default: ''
      values_file:
        description: 'Path to values file'
        required: false
        type: string
        default: ''
      helm_repo_name:
        description: 'Helm repo name'
        required: false
        type: string
        default: ''
      helm_repo_url:
        description: 'Helm repo URL'
        required: false
        type: string
        default: ''
      timeout:
        description: 'Helm operation timeout'
        required: false
        type: string
        default: '5m'
      image_tag:
        description: 'Image tag to deploy'
        required: false
        type: string
        default: ''
    secrets:
      kube_config:
        required: true
      ts_oauth_client_id:
        required: true
      ts_oauth_secret:
        required: true

jobs:
  cd:
    name: Helm CD - ${{ inputs.release_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.kube_config }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Add Helm repository
        if: ${{ inputs.helm_repo_name != '' && inputs.helm_repo_url != '' }}
        env:
          HELM_REPO_NAME: ${{ inputs.helm_repo_name }}
          HELM_REPO_URL: ${{ inputs.helm_repo_url }}
        run: |
          helm repo add "$HELM_REPO_NAME" "$HELM_REPO_URL"
          helm repo update

      - name: Deploy with Helm
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          CHART: ${{ inputs.chart }}
          NAMESPACE: ${{ inputs.namespace }}
          TIMEOUT: ${{ inputs.timeout }}
          CHART_VERSION: ${{ inputs.chart_version }}
          VALUES_FILE: ${{ inputs.values_file }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "Deploying $RELEASE_NAME to namespace $NAMESPACE"

          cmd=(helm upgrade "$RELEASE_NAME" "$CHART"
            --install
            --create-namespace
            --namespace "$NAMESPACE"
            --timeout "$TIMEOUT"
            --history-max=3
            --rollback-on-failure
            --wait)

          if [ -n "$CHART_VERSION" ]; then
            cmd+=(--version "$CHART_VERSION")
          fi

          if [ -n "$VALUES_FILE" ]; then
            cmd+=(--values "$VALUES_FILE")
          fi

          if [ -n "$IMAGE_TAG" ]; then
            cmd+=(--set "image.tag=$IMAGE_TAG")
          fi

          echo "Running: ${cmd[*]}"
          "${cmd[@]}"

      - name: Cleanup kubeconfig
        if: always()
        run: |
          rm -f "$HOME/.kube/config"
