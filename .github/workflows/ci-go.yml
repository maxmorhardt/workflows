name: Go CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      working_directory:
        description: 'Working directory to run from'
        required: false
        type: string
        default: '.'

jobs:
  ci:
    name: Go CI - ${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository }}

      - name: Find the module
        id: module
        working-directory: .
        env:
          DIR: ${{ inputs.working_directory }}
        run: |
          dir="$DIR"
          until [ -f "$dir/go.mod" ]; do
            if [ "$dir" = . ]; then
              echo "no go.mod at or above $DIR"
              exit 1
            fi
            dir=$(dirname "$dir")
          done
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ steps.module.outputs.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ steps.module.outputs.dir }}/go.sum

      - name: Verify dependencies
        run: make verify

      - name: Run go vet
        run: make vet

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          working-directory: ${{ inputs.working_directory }}

      - name: Check swagger docs are up to date
        run: |
          if make -n swag-check >/dev/null 2>&1; then
            make swag-check
          else
            echo "no swag-check target, skipping"
          fi

      - name: Run unit tests and coverage gate
        run: make cover RACE=-race

      - name: Run integration tests
        run: make test-integration RACE=-race

      - name: Generate coverage report
        run: make cover-html

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: go-coverage-report
          path: ${{ inputs.working_directory }}/coverage.html
          retention-days: 7

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.working_directory }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
