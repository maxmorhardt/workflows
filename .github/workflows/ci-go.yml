name: Go CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      swagger:
        description: 'Verify swagger docs are up to date'
        required: false
        type: boolean
        default: false
      working_directory:
        description: 'Root module directory to run in'
        required: false
        type: string
        default: '.'

jobs:
  ci:
    name: Go CI - ${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working_directory }}/go.mod
          cache: true
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Verify dependencies
        run: make verify

      - name: Run go vet
        run: make vet

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ inputs.working_directory }}

      - name: Check swagger docs are up to date
        if: ${{ inputs.swagger }}
        run: make swag-check

      - name: Run unit tests and coverage gate
        run: make cover RACE=-race

      - name: Run integration tests
        run: make test-integration RACE=-race

      - name: Generate coverage report
        run: make cover-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage-report
          path: ${{ inputs.working_directory }}/coverage.html
          retention-days: 7

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.working_directory }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
