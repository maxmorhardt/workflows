name: Go CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      swagger:
        description: 'Whether the project has swagger docs to verify (runs make swag-check)'
        required: false
        type: boolean
        default: false

env:
  GO_VERSION: '1.26'

jobs:
  ci:
    name: Go CI - ${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: make verify

      - name: Run go vet
        run: make vet

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Check swagger docs are up to date
        if: ${{ inputs.swagger }}
        run: make swag-check

      - name: Run unit tests and coverage gate
        run: make cover RACE=-race

      - name: Run integration tests
        run: make test-integration RACE=-race

      - name: Generate coverage report
        run: make cover-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage-report
          path: coverage.html
          retention-days: 7

      - name: Build Go binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: make build BUILD_FLAGS="-a" LDFLAGS="-s -w"

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}
          path: bin/
          retention-days: 7
