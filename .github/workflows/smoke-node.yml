name: Smoke Test (Node)

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository containing the smoke tests'
        required: true
        type: string
      release_name:
        description: 'Helm release name'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: true
        type: string
      smoke_url:
        description: 'Base URL the smoke tests run against'
        required: true
        type: string
      timeout:
        description: 'Helm rollback timeout'
        required: false
        type: string
        default: '5m'
    secrets:
      kube_config:
        required: true
      ts_oauth_client_id:
        required: true
      ts_oauth_secret:
        required: true

jobs:
  smoke:
    name: Smoke Test - ${{ inputs.release_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.smoke_url }}
        run: pnpm test-smoke

  rollback:
    needs: smoke
    if: ${{ failure() }}
    uses: maxmorhardt/workflows/.github/workflows/cd-helm-rollback.yml@main
    with:
      release_name: ${{ inputs.release_name }}
      namespace: ${{ inputs.namespace }}
      timeout: ${{ inputs.timeout }}
    secrets: inherit
