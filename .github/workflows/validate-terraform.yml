name: Terraform Validate

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      working_directory:
        description: 'Root module directory to run in'
        required: true
        type: string
      fail_on_diff:
        description: 'Fail when the plan is not empty'
        required: false
        type: boolean
        default: false
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      cloudflare_api_token:
        required: false
      repo_admin_token:
        required: false
      tf_vars:
        required: false

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
  TERRAFORM_VERSION: '1.17.1'

jobs:
  validate:
    name: Terraform Validate - ${{ inputs.working_directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Write variables
        env:
          TF_VARS: ${{ secrets.tf_vars }}
        run: |
          if [ -n "$TF_VARS" ]; then
            printf '%s\n' "$TF_VARS" > ci.auto.tfvars
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_api_token }}
          GITHUB_TOKEN: ${{ secrets.repo_admin_token }}
          FAIL_ON_DIFF: ${{ inputs.fail_on_diff }}
          WORKDIR: ${{ inputs.working_directory }}
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e

          if [ "$code" -eq 1 ]; then
            cat plan.txt
          fi

          {
            echo "### Terraform plan - \`$WORKDIR\`"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -eq 1 ]; then
            echo "plan failed"
            exit 1
          fi

          if [ "$code" -eq 2 ] && [ "$FAIL_ON_DIFF" = "true" ]; then
            echo "drift detected: live infrastructure no longer matches this configuration"
            exit 1
          fi
