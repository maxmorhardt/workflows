name: Argo CD

on:
  workflow_call:
    inputs:
      app:
        description: 'Argo CD Application name'
        required: true
        type: string
      environment:
        description: 'Cluster to deploy to: dev or prod'
        required: false
        type: string
        default: prod
      image_tag:
        description: 'Image tag to deploy'
        required: false
        type: string
        default: ''
      revision:
        description: 'Git ref the Application takes its chart from'
        required: false
        type: string
        default: ''
    secrets:
      gitops_token:
        required: true

jobs:
  cd:
    name: Argo CD - ${{ inputs.app }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment == 'prod' && 'production' || 'development' }}
    permissions:
      contents: read
    steps:
      - name: Checkout gitops repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/gitops
          token: ${{ secrets.gitops_token }}

      - name: Bump Application
        id: bump
        env:
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REVISION: ${{ inputs.revision }}
        run: |
          case "$ENVIRONMENT" in
            dev|prod) ;;
            *) echo "environment must be dev or prod, got '$ENVIRONMENT'"; exit 1 ;;
          esac
          if [ -z "$IMAGE_TAG" ] && [ -z "$REVISION" ]; then
            echo "nothing to do: pass image_tag, revision, or both"
            exit 1
          fi

          file="clusters/$ENVIRONMENT/apps/$APP.yaml"
          if [ ! -f "$file" ]; then
            echo "no Application manifest at $file"
            exit 1
          fi

          changes=()

          if [ -n "$IMAGE_TAG" ]; then
            previous=$(yq '.spec.source.helm.parameters[] | select(.name == "image.tag") | .value' "$file")
            if [ -z "$previous" ] || [ "$previous" = "null" ]; then
              echo "$file has no image.tag parameter to bump"
              exit 1
            fi
            IMAGE_TAG="$IMAGE_TAG" yq -i \
              '(.spec.source.helm.parameters[] | select(.name == "image.tag") | .value) = strenv(IMAGE_TAG)' \
              "$file"
            echo "image.tag: $previous -> $IMAGE_TAG"
            changes+=("$IMAGE_TAG")
          fi

          if [ -n "$REVISION" ]; then
            previous=$(yq '.spec.source.targetRevision' "$file")
            REVISION="$REVISION" yq -i '.spec.source.targetRevision = strenv(REVISION)' "$file"
            echo "targetRevision: $previous -> $REVISION"
            changes+=("chart $REVISION")
          fi

          echo "summary=${changes[*]}" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          FILE: ${{ steps.bump.outputs.file }}
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          if git diff --quiet; then
            echo "$APP in $ENVIRONMENT is already at $SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m "chore($APP): deploy $SUMMARY to $ENVIRONMENT"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase
          done

          echo "could not push after 3 attempts"
          exit 1
