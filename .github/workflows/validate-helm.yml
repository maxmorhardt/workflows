name: Helm Validate

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout (local charts / values files)'
        required: true
        type: string
      chart:
        description: 'Chart to render: a local directory, a repo/chart ref, or an oci:// ref'
        required: true
        type: string
      chart_version:
        description: 'Chart version to render (remote charts)'
        required: false
        type: string
        default: ''
      helm_repo_name:
        description: 'Helm repo name to add before rendering'
        required: false
        type: string
        default: ''
      helm_repo_url:
        description: 'Helm repo URL to add before rendering'
        required: false
        type: string
        default: ''
      values_file:
        description: 'Values file to render with'
        required: false
        type: string
        default: ''
      lint:
        description: 'Run `helm lint --strict` (local charts only)'
        required: false
        type: boolean
        default: false
      ignore_missing_schemas:
        description: 'Pass -ignore-missing-schemas to kubeconform'
        required: false
        type: boolean
        default: false
      release_name:
        description: 'Release name used for `helm template`'
        required: false
        type: string
        default: 'validate'
      working_directory:
        description: 'Working directory for helm commands'
        required: false
        type: string
        default: '.'

jobs:
  validate:
    name: Validate - ${{ inputs.chart }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Install Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Add Helm repository
        if: ${{ inputs.helm_repo_name != '' && inputs.helm_repo_url != '' }}
        env:
          HELM_REPO_NAME: ${{ inputs.helm_repo_name }}
          HELM_REPO_URL: ${{ inputs.helm_repo_url }}
        run: |
          helm repo add "$HELM_REPO_NAME" "$HELM_REPO_URL"
          helm repo update

      - name: Lint Helm chart
        if: ${{ inputs.lint }}
        working-directory: ${{ inputs.working_directory }}
        env:
          CHART: ${{ inputs.chart }}
        run: |
          helm lint "$CHART" --strict

      - name: Template and validate
        working-directory: ${{ inputs.working_directory }}
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          CHART: ${{ inputs.chart }}
          CHART_VERSION: ${{ inputs.chart_version }}
          VALUES_FILE: ${{ inputs.values_file }}
          IGNORE_MISSING_SCHEMAS: ${{ inputs.ignore_missing_schemas }}
        run: |
          template_cmd=(helm template "$RELEASE_NAME" "$CHART")
          if [ -n "$CHART_VERSION" ]; then
            template_cmd+=(--version "$CHART_VERSION")
          fi
          if [ -n "$VALUES_FILE" ]; then
            template_cmd+=(--values "$VALUES_FILE")
          fi

          kubeconform_cmd=(kubeconform -strict -summary)
          if [ "$IGNORE_MISSING_SCHEMAS" = "true" ]; then
            kubeconform_cmd+=(-ignore-missing-schemas)
          fi
          kubeconform_cmd+=(-schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')

          echo "Running: ${template_cmd[*]} | ${kubeconform_cmd[*]}"
          "${template_cmd[@]}" | "${kubeconform_cmd[@]}"
