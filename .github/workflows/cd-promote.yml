name: Promote image

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Image name'
        required: true
        type: string
      source_tag:
        description: 'Tag of the dev image; leave empty to find it with path_filters'
        required: false
        type: string
        default: ''
      path_filters:
        description: 'Space-separated filter names in .github/path-filters.yml; promotes sha-<commit> of the last commit before the released one that changed them'
        required: false
        type: string
        default: ''
      target_tag:
        description: 'Tag to promote source to'
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_password:
        required: true

jobs:
  promote:
    name: Promote - ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        if: inputs.source_tag == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # the release commit only changes changelogs, so promote dev's build of the last real change
      - name: Find the source tag
        id: source
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          FILTERS: ${{ inputs.path_filters }}
        run: |
          if [ -n "$SOURCE_TAG" ]; then
            echo "tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -ra filters <<< "$FILTERS"
          if [ "${#filters[@]}" -eq 0 ]; then
            echo "::error::set source_tag or path_filters"
            exit 1
          fi
          paths=()
          for f in "${filters[@]}"; do
            if ! yq -e ".${f}" .github/path-filters.yml >/dev/null; then
              echo "::error::no filter named $f in .github/path-filters.yml"
              exit 1
            fi
            mapfile -t -O "${#paths[@]}" paths < <(yq ".${f}[]" .github/path-filters.yml | sed 's/^/:(glob)/')
          done
          commit=$(git log -1 --format=%H "$GITHUB_SHA^" -- "${paths[@]}" ':(glob,exclude)**/CHANGELOG.md')
          if [ -z "$commit" ]; then
            echo "::error::no commit before $GITHUB_SHA changed ${filters[*]}"
            exit 1
          fi
          echo "tag=sha-${commit::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Wait for the source image
        timeout-minutes: 15
        env:
          SOURCE: docker.io/${{ secrets.docker_username }}/${{ inputs.app_name }}:${{ steps.source.outputs.tag }}
        run: |
          until docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; do
            echo "waiting for $SOURCE"
            sleep 30
          done

      - name: Retag
        id: retag
        env:
          IMAGE: docker.io/${{ secrets.docker_username }}/${{ inputs.app_name }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$TARGET_TAG" -t "$IMAGE:stable" "$IMAGE:$SOURCE_TAG"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$TARGET_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Report promotion
        env:
          IMAGE: ${{ secrets.docker_username }}/${{ inputs.app_name }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
          DIGEST: ${{ steps.retag.outputs.digest }}
        run: |
          {
            echo "### Image promoted"
            echo ""
            echo "\`$IMAGE:$SOURCE_TAG\` → \`$IMAGE:$TARGET_TAG\`, \`stable\`"
            echo ""
            echo "**Digest:** \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
