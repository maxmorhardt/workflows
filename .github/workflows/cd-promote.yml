name: Promote image

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Image name under the Docker Hub account'
        required: true
        type: string
      source_tag:
        description: 'Tag of the image already built and tested, e.g. sha-1a2b3c4'
        required: true
        type: string
      target_tag:
        description: 'Tag to promote it to, e.g. 1.4.0'
        required: true
        type: string
      latest:
        description: 'Also tag the promoted image as latest'
        required: false
        type: boolean
        default: true
      wait_minutes:
        description: 'How long to wait for the source tag to be pushed'
        required: false
        type: number
        default: 45
    secrets:
      docker_username:
        required: true
      docker_password:
        required: true

jobs:
  promote:
    name: Promote - ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Wait for the source image
        env:
          SOURCE: docker.io/${{ secrets.docker_username }}/${{ inputs.app_name }}:${{ inputs.source_tag }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          until docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "$SOURCE was not pushed within $WAIT_MINUTES minutes"
              exit 1
            fi
            echo "waiting for $SOURCE"
            sleep 30
          done

      - name: Retag
        id: retag
        env:
          IMAGE: docker.io/${{ secrets.docker_username }}/${{ inputs.app_name }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          tags=(-t "$IMAGE:$TARGET_TAG")
          if [ "$LATEST" = "true" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$SOURCE_TAG"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$TARGET_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Report promotion
        env:
          IMAGE: ${{ secrets.docker_username }}/${{ inputs.app_name }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
          DIGEST: ${{ steps.retag.outputs.digest }}
        run: |
          {
            echo "### Image promoted"
            echo ""
            echo "\`$IMAGE:$SOURCE_TAG\` → \`$IMAGE:$TARGET_TAG\`"
            echo ""
            echo "**Digest:** \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
