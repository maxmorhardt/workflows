name: Manifest Validate

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      manifests:
        description: 'Newline or space-separated manifest files, directories, or globs to validate'
        required: true
        type: string

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository }}

      - name: Install Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          cmd=(kubeconform -strict -summary -skip CustomResourceDefinition
            -schema-location default
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')

          # shellcheck disable=SC2206 # split on whitespace and expand globs on purpose
          files=($MANIFESTS)
          echo "Running: ${cmd[*]} ${files[*]}"
          "${cmd[@]}" "${files[@]}"
