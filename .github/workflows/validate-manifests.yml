name: Manifest Validate

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      manifests:
        description: 'Newline or space-separated manifest files, directories, or globs to validate'
        required: true
        type: string
      ignore_missing_schemas:
        description: 'Pass -ignore-missing-schemas to kubeconform'
        required: false
        type: boolean
        default: true

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Install Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate
        env:
          MANIFESTS: ${{ inputs.manifests }}
          IGNORE_MISSING_SCHEMAS: ${{ inputs.ignore_missing_schemas }}
        run: |
          cmd=(kubeconform -strict -summary)
          if [ "$IGNORE_MISSING_SCHEMAS" = "true" ]; then
            cmd+=(-ignore-missing-schemas)
          fi
          cmd+=(-schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')

          files=($MANIFESTS)
          echo "Running: ${cmd[*]} ${files[*]}"
          "${cmd[@]}" "${files[@]}"
