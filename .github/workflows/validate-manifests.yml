name: Manifest Validate

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      manifests:
        description: 'Newline or space-separated manifest files, directories, or globs to validate'
        required: true
        type: string

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository }}
          persist-credentials: false

      - name: Install Kubeconform
        env:
          # renovate: datasource=github-releases depName=yannh/kubeconform
          KUBECONFORM_VERSION: 'v0.8.0'
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION"
          wget -q "$base/kubeconform-linux-amd64.tar.gz" "$base/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar xf kubeconform-linux-amd64.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          cmd=(kubeconform -strict -summary -skip CustomResourceDefinition
            -schema-location default
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')

          # shellcheck disable=SC2206 # split on whitespace and expand globs on purpose
          files=($MANIFESTS)
          echo "Running: ${cmd[*]} ${files[*]}"
          "${cmd[@]}" "${files[@]}"
