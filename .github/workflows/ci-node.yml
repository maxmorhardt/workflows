name: Node CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      app_name:
        description: 'Application name'
        required: true
        type: string
      working_directory:
        description: 'Working directory to run from'
        required: false
        type: string
        default: '.'

env:
  # renovate: datasource=node-version depName=node
  NODE_VERSION: '24'

jobs:
  ci:
    name: Node CI - ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.working_directory }}/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.working_directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Run linter
        run: pnpm run lint

      - name: Security audit
        run: pnpm audit --prod --audit-level high

      - name: Run tests with coverage
        run: pnpm run test --run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ inputs.app_name }}
          path: ${{ inputs.working_directory }}/coverage/
          retention-days: 7

      - name: Build application
        run: pnpm run build

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.working_directory }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.app_name }}
          path: ${{ inputs.working_directory }}/dist/
          retention-days: 7
