name: Manifest CD

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      manifests:
        description: 'Space or newline-separated manifest files to apply'
        required: true
        type: string
      wait_for:
        description: 'Newline-separated kubectl wait expressions'
        required: false
        type: string
        default: ''
      rollout:
        description: 'Newline-separated rollout status targets to wait on'
        required: false
        type: string
        default: ''
      timeout:
        description: 'Timeout for wait or rollout operations'
        required: false
        type: string
        default: '5m'
    secrets:
      kube_config:
        required: true
      ts_oauth_client_id:
        required: true
      ts_oauth_secret:
        required: true

jobs:
  cd:
    name: Manifest CD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          oauth-secret: ${{ secrets.ts_oauth_secret }}
          tags: tag:ci

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.kube_config }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          files=($MANIFESTS)
          args=()
          for m in "${files[@]}"; do
            args+=(-f "$m")
          done
          echo "kubectl apply ${args[*]}"
          kubectl apply "${args[@]}"

      - name: Wait for resources
        if: ${{ inputs.wait_for != '' }}
        env:
          WAIT_FOR: ${{ inputs.wait_for }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "kubectl wait --timeout=$TIMEOUT $line"
            kubectl wait --timeout="$TIMEOUT" $line
          done <<< "$WAIT_FOR"

      - name: Wait for rollouts
        if: ${{ inputs.rollout != '' }}
        env:
          ROLLOUT: ${{ inputs.rollout }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "kubectl rollout status $line --timeout=$TIMEOUT"
            kubectl rollout status $line --timeout="$TIMEOUT"
          done <<< "$ROLLOUT"

      - name: Cleanup kubeconfig
        if: always()
        run: |
          rm -f $HOME/.kube/config
