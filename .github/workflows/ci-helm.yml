name: Helm CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      chart_directory:
        description: 'Chart directory name to package'
        required: true
        type: string
      chart_name:
        description: 'Helm chart name'
        required: true
        type: string
      working_directory:
        description: 'Working directory for helm package command'
        required: false
        type: string
        default: '.'
      push:
        description: 'Push the chart to the registry'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    uses: maxmorhardt/workflows/.github/workflows/validate-helm.yml@main
    with:
      repository: ${{ inputs.repository }}
      chart: ${{ inputs.chart_directory }}
      working_directory: ${{ inputs.working_directory }}
      lint: true

  package:
    name: Helm Package - ${{ inputs.chart_name }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Login to Helm registry
        if: inputs.push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username "$ACTOR" --password-stdin

      - name: Package Helm chart
        id: package
        working-directory: ${{ inputs.working_directory }}
        env:
          CHART_DIRECTORY: ${{ inputs.chart_directory }}
          CHART_NAME: ${{ inputs.chart_name }}
        run: |
          helm package "$CHART_DIRECTORY"

          shopt -s nullglob
          matches=( "$CHART_NAME"-*.tgz )
          shopt -u nullglob
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "Expected exactly one chart package matching ${CHART_NAME}-*.tgz, found ${#matches[@]}." >&2
            exit 1
          fi
          CHART_FILE="${matches[0]}"
          CHART_VERSION=$(echo "$CHART_FILE" | sed 's/.*-\(.*\)\.tgz/\1/')

          echo "chart_file=$CHART_FILE" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

          sha256sum "$CHART_FILE" > "${CHART_FILE}.sha256"
          echo "Chart: $CHART_FILE"
          echo "Version: $CHART_VERSION"
          echo "SHA256: $(cat "${CHART_FILE}.sha256")"

      - name: Push Helm chart
        if: inputs.push
        id: push
        working-directory: ${{ inputs.working_directory }}
        env:
          CHART_FILE: ${{ steps.package.outputs.chart_file }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          PUSH_OUTPUT=$(helm push "$CHART_FILE" "oci://ghcr.io/$REPO_OWNER/charts" 2>&1)
          echo "$PUSH_OUTPUT"

          DIGEST=$(echo "$PUSH_OUTPUT" | grep -oP 'Digest: \K[^ ]+')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.chart_name }}-${{ steps.package.outputs.chart_version }}
          path: |
            ${{ inputs.working_directory }}/${{ steps.package.outputs.chart_file }}
            ${{ inputs.working_directory }}/${{ steps.package.outputs.chart_file }}.sha256
          retention-days: 30

      - name: Report chart details
        if: inputs.push
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_VERSION: ${{ steps.package.outputs.chart_version }}
          REPO_OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Helm Chart Published"
            echo ""
            echo "**Chart:** \`$CHART_NAME\`"
            echo "**Version:** \`$CHART_VERSION\`"
            echo "**Registry:** \`oci://ghcr.io/$REPO_OWNER/charts/$CHART_NAME\`"
            echo "**Digest:** \`$DIGEST\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logout from Helm registry
        if: always() && inputs.push
        run: |
          helm registry logout ghcr.io
