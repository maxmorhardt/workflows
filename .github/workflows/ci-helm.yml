name: Helm CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      chart:
        description: 'Path to the chart directory'
        required: true
        type: string
      version:
        description: 'Chart version to publish'
        required: false
        type: string
        default: ''

jobs:
  publish:
    name: Helm Publish - ${{ inputs.chart }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository }}
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: 'v4.3.1'

      - name: Package and push
        env:
          CHART: ${{ inputs.chart }}
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(yq '.name' "$CHART/Chart.yaml")
          version="${VERSION:-$(yq '.version' "$CHART/Chart.yaml")}"
          registry="oci://ghcr.io/$OWNER/charts"

          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$OWNER" --password-stdin
          helm package "$CHART" --version "$version"
          helm push "$name-$version.tgz" "$registry" 2>&1 | tee push.txt
          digest=$(awk '/^Digest:/ {print $2}' push.txt)

          {
            echo "### Helm chart published"
            echo ""
            echo "\`$registry/$name:$version\`"
            echo ""
            echo "**Digest:** \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
