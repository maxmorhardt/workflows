name: Helm CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      chart:
        description: 'Chart directory, relative to working_directory'
        required: true
        type: string
      working_directory:
        description: 'Working directory to run from'
        required: false
        type: string
        default: '.'
      version:
        description: 'Chart version to publish, overriding Chart.yaml'
        required: false
        type: string
        default: ''

jobs:
  validate:
    uses: maxmorhardt/workflows/.github/workflows/validate-helm.yml@main
    with:
      repository: ${{ inputs.repository }}
      chart: ${{ inputs.chart }}
      working_directory: ${{ inputs.working_directory }}
      lint: true
      set_values: image.tag=0.0.0-validate

  publish:
    name: Helm Publish - ${{ inputs.chart }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Package and push
        env:
          CHART: ${{ inputs.chart }}
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(yq '.name' "$CHART/Chart.yaml")
          version="${VERSION:-$(yq '.version' "$CHART/Chart.yaml")}"
          registry="oci://ghcr.io/$OWNER/charts"

          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$OWNER" --password-stdin
          helm package "$CHART" --version "$version"
          helm push "$name-$version.tgz" "$registry" 2>&1 | tee push.txt
          digest=$(awk '/^Digest:/ {print $2}' push.txt)

          {
            echo "### Helm chart published"
            echo ""
            echo "\`$registry/$name:$version\`"
            echo ""
            echo "**Digest:** \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
