name: Helm CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      chart_directory:
        description: 'Chart directory name to package'
        required: true
        type: string
      chart_name:
        description: 'Helm chart name'
        required: true
        type: string
      working_directory:
        description: 'Working directory for helm package command'
        required: false
        type: string
        default: '.'
      push:
        description: 'Push the chart to the registry'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    uses: maxmorhardt/workflows/.github/workflows/validate-helm.yml@main
    with:
      repository: ${{ inputs.repository }}
      chart: ${{ inputs.chart_directory }}
      working_directory: ${{ inputs.working_directory }}
      lint: true

  package:
    name: Helm Package - ${{ inputs.chart_name }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Login to Helm registry
        if: inputs.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        id: package
        working-directory: ${{ inputs.working_directory }}
        run: |
          helm package ${{ inputs.chart_directory }}

          CHART_FILE=$(ls ${{ inputs.chart_name }}-*.tgz)
          CHART_VERSION=$(echo $CHART_FILE | sed 's/.*-\(.*\)\.tgz/\1/')

          echo "chart_file=$CHART_FILE" >> $GITHUB_OUTPUT
          echo "chart_version=$CHART_VERSION" >> $GITHUB_OUTPUT

          sha256sum $CHART_FILE > ${CHART_FILE}.sha256
          echo "Chart: $CHART_FILE"
          echo "Version: $CHART_VERSION"
          echo "SHA256: $(cat ${CHART_FILE}.sha256)"

      - name: Push Helm chart
        if: inputs.push
        id: push
        working-directory: ${{ inputs.working_directory }}
        run: |
          PUSH_OUTPUT=$(helm push ${{ steps.package.outputs.chart_file }} oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)
          echo "$PUSH_OUTPUT"

          DIGEST=$(echo "$PUSH_OUTPUT" | grep -oP 'Digest: \K[^ ]+')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Upload chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.chart_name }}-${{ steps.package.outputs.chart_version }}
          path: |
            ${{ inputs.working_directory }}/${{ steps.package.outputs.chart_file }}
            ${{ inputs.working_directory }}/${{ steps.package.outputs.chart_file }}.sha256
          retention-days: 30

      - name: Report chart details
        if: inputs.push
        run: |
          echo "### Helm Chart Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** \`${{ inputs.chart_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.package.outputs.chart_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`oci://ghcr.io/${{ github.repository_owner }}/charts/${{ inputs.chart_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Logout from Helm registry
        if: always() && inputs.push
        run: |
          helm registry logout ghcr.io
