name: Docker CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      app_name:
        description: 'Application name'
        required: true
        type: string
      app_version:
        description: 'Application version to tag the Docker image'
        required: false
        type: string
        default: 'ci'
      artifact_name:
        description: 'Name of the build artifact to download'
        required: false
        type: string
        default: ''
      artifact_path:
        description: 'Path where the artifact should be downloaded'
        required: false
        type: string
        default: 'dist'
      push:
        description: 'Push image to Docker Hub'
        required: false
        type: boolean
        default: false
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to the Dockerfile'
        required: false
        type: string
        default: ''
      build_args:
        description: 'Newline-separated build arguments'
        required: false
        type: string
        default: ''
    secrets:
      docker_username:
        required: true
      docker_password:
        required: true

jobs:
  ci:
    name: Docker CI - ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository }}

      - name: Download build artifact
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          failure-threshold: warning
          ignore: DL3018

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build_args }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          input: ${{ runner.temp }}/image
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Scan linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          input: ${{ runner.temp }}/image
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Push
        if: ${{ inputs.push }}
        env:
          LAYOUT: ${{ runner.temp }}/image
          IMAGE: docker.io/${{ secrets.docker_username }}/${{ inputs.app_name }}
          VERSION: ${{ inputs.app_version }}
        run: |
          skopeo copy --all "oci:$LAYOUT" "docker://$IMAGE:$VERSION"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Docker image published"
            echo ""
            echo "**Digest:** \`$digest\`"
            echo ""
            echo "**Tags:** \`$IMAGE:$VERSION\`, \`$IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
