name: Docker CI

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      app_name:
        description: 'Application name'
        required: true
        type: string
      app_version:
        description: 'Application version to tag the Docker image'
        required: false
        type: string
        default: 'ci'
      artifact_name:
        description: 'Name of the build artifact to download'
        required: false
        type: string
        default: ''
      artifact_path:
        description: 'Path where the artifact should be downloaded'
        required: false
        type: string
        default: 'dist'
      push:
        description: 'Push image to Docker Hub'
        required: false
        type: boolean
        default: false
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to the Dockerfile'
        required: false
        type: string
        default: ''
      build_args:
        description: 'Newline-separated build arguments'
        required: false
        type: string
        default: ''
    secrets:
      docker_username:
        required: true
      docker_password:
        required: true

jobs:
  ci:
    name: Docker CI - ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Download build artifact
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build_args }}
          platforms: ${{ inputs.push && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan linux/amd64
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          input: ${{ runner.temp }}/image
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Scan linux/arm64
        if: ${{ inputs.push }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          input: ${{ runner.temp }}/image
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Push the scanned image
        if: ${{ inputs.push }}
        env:
          LAYOUT: ${{ runner.temp }}/image
          IMAGE: docker.io/${{ secrets.docker_username }}/${{ inputs.app_name }}
          VERSION: ${{ inputs.app_version }}
        run: |
          skopeo copy --all "oci:$LAYOUT" "docker://$IMAGE:$VERSION"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Docker image published"
            echo ""
            echo "**Digest:** \`$digest\`"
            echo ""
            echo "**Tags:** \`$IMAGE:$VERSION\`, \`$IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
